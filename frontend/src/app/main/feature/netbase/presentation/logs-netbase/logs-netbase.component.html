<!-- Body -->
<div
    class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent bg-customgray"
>
    <!-- Alert -->
    <fuse-alert
        class="mt-8"
        *ngIf="showAlert"
        [appearance]="'outline'"
        [showIcon]="false"
        [type]="alert.type"
        [@shake]="alert.type === 'error'"
    >
        {{ alert.message }}
    </fuse-alert>

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8"
    >
        <tt-view-header [title]="'REGISTROS NETBASE'"></tt-view-header>
        <!-- Actions -->
        <div
            class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4 justify-end"
        >
            <!-- Exportar -->
            <div
                class="sm:w-full lg:h-full w-16 h-10 items-center justify-center shadow-lg rounded-lg cursor-pointer bg-green-600 bg-opacity-90 print:hidden"
                matTooltip="Exportar a Excel"
            >
                <button
                    (click)="exportNetbaseExcel()"
                    class="text-white mx-auto flex mt-[1px] flex-row pt-[8px] pb-[11px] px-3"
                    [disabled]="isDownloading"
                >
                    <mat-icon
                        *ngIf="!isDownloading; else loading"
                        class="icon-size-5 text-white mr-1"
                        [svgIcon]="'heroicons_outline:table-cells'"
                    ></mat-icon>
                    <ng-container *ngIf="!isDownloading; else loadingText">
                        <span class="hidden md:block">Exportar a Excel</span>
                    </ng-container>

                    <ng-template #loading>
                        <svg
                            class="animate-spin -ml-1 mr-1 h-5 w-5 text-white"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                        >
                            <circle
                                class="opacity-0"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-100"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                            ></path>
                        </svg>
                    </ng-template>

                    <ng-template #loadingText> Espere un momento </ng-template>
                </button>
            </div>

            <!-- Filtro -->
            <tt-filter-netbase
                class="ml-4 lg:ml-4"
                [valuesPagination]="filter$ | async"
            ></tt-filter-netbase>
        </div>
    </div>

    <!-- Main -->
    <div
        class="flex flex-auto overflow-hidden"
        [ngClass]="{ 'mt-16': dropdownOpen, 'mt-0': !dropdownOpen }"
    >
        <!-- Products list -->
        <div
            class="flex flex-col flex-auto sm:mb-18 overflow-hidden overflow-x-auto sm:overflow-y-auto"
        >
            <tt-table
                [data]="data$ | async"
                [columns]="columns"
                [total]="responsePagination?.totalRecords"
                (changePaginator)="changePaginator($event)"
            ></tt-table>
        </div>
    </div>
</div>
