<!-- policy.component.html -->
<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent bg-customgray">
    <!-- Alert -->
    <fuse-alert
        class="mt-8"
        *ngIf="showAlert"
        [appearance]="'outline'"
        [showIcon]="false"
        [type]="alert.type"
        [@shake]="alert.type === 'error'">
        {{ alert.message }}
    </fuse-alert>

    <!-- Header -->
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8">
        <ms-view-header [title]="'PÓLIZAS'"></ms-view-header>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-4">
            <div
                class="shadow-lg rounded-lg px-4 py-2 flex items-center space-x-2 bg-green-600 bg-opacity-90 cursor-pointer"
                matTooltip="Exportar a Excel">
                <button mat-button (click)="exportToExcel()" class="text-white flex items-center">
                    <mat-icon class="icon-size-5 text-white" [svgIcon]="'heroicons_outline:document-arrow-down'"></mat-icon>
                    <span class="ml-1">Exportar Excel</span>
                </button>
            </div>
            <div
                class="shadow-lg rounded-lg px-4 py-2 flex items-center space-x-2 bg-blue-900 bg-opacity-90 cursor-pointer"
                matTooltip="Nueva Póliza">
                <button mat-button (click)="create()" class="text-white flex items-center">
                    <mat-icon class="icon-size-5 text-white" [svgIcon]="'heroicons_solid:plus'"></mat-icon>
                    <span class="ml-1">Crear Póliza</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">
        <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden overflow-x-auto sm:overflow-y-auto">
            <ms-table
                [data]="data$ | async"
                [columns]="columns"
                [total]="responsePagination?.totalRecords"
                (edit)="edit($event)"
                (changePaginator)="onPaginationChange($event)"
                (toggleStatus)="toggleStatus($event)">
            </ms-table>
        </div>
    </div>
</div>
