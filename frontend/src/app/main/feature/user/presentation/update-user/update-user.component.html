<div style="overflow-y: auto; max-height: 90vh; padding: 10px">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">
        Editar Usuario
    </h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
        {{ alert.message }}
    </fuse-alert>

    <form autocomplete="off" [formGroup]="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="off" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Rol</mat-label>
            <mat-select formControlName="role">
                <mat-option *ngFor="let role of roles" [value]="role.value">
                    {{ role.label }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </form>

    <div class="flex justify-end mt-4 space-x-4">
        <button mat-raised-button color="warn" (click)="close()" class="px-6 py-2 font-semibold rounded-lg"
            [disabled]="isSaving">
            Cancelar
        </button>
        <button mat-raised-button (click)="save()" [disabled]="!form.valid || isSaving"
            [ngClass]="{ 'bg-blue-900 text-white': form.valid && !isSaving }"
            class="px-6 py-2 font-semibold rounded-lg shadow-md transition-shadow duration-300 hover:shadow-md">
            Guardar
        </button>
    </div>
</div>
