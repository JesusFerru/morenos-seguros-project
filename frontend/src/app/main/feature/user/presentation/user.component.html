<!-- Body -->
<div
    class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent bg-customgray"
>
    <!-- Alert -->
    <fuse-alert
        class="mt-8"
        *ngIf="showAlert"
        [appearance]="'outline'"
        [showIcon]="false"
        [type]="alert.type"
        [@shake]="alert.type === 'error'"
    >
        {{ alert.message }}
    </fuse-alert>

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8"
    >
        <tt-view-header [title]="'USUARIOS'"></tt-view-header>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-4">
            <!-- Exportar -->
            <div
                class="flex items-center shadow-lg rounded-lg cursor-pointer bg-green-600 bg-opacity-90 print:hidden px-4 py-2"
                matTooltip="Exportar a Excel"
            >
                <button
                    (click)="downloadUsersExcel()"
                    class="flex items-center text-white font-medium"
                    [disabled]="isDownloading"
                >
                    <mat-icon
                        *ngIf="!isDownloading; else loading"
                        class="icon-size-5 text-white mr-2"
                        [svgIcon]="'heroicons_outline:table-cells'"
                    ></mat-icon>
                    <ng-container *ngIf="!isDownloading; else loadingText">
                        <span class="hidden md:block">Exportar a Excel</span>
                    </ng-container>

                    <ng-template #loading>
                        <svg
                            class="animate-spin h-5 w-5 text-white"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                        >
                            <circle
                                class="opacity-0"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-100"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                            ></path>
                        </svg>
                    </ng-template>

                    <ng-template #loadingText> Espere un momento </ng-template>
                </button>
            </div>

            <!-- Crear Usuario -->
            <div
                class="shadow-lg rounded-lg px-4 py-2 flex items-center space-x-2 bg-blue-900 bg-opacity-90 cursor-pointer"
                matTooltip="Nuevo Usuario"
            >
                <button
                    mat-button
                    (click)="createUser()"
                    class="text-white flex items-center"
                >
                    <mat-icon
                        class="icon-size-5 text-white"
                        [svgIcon]="'heroicons_solid:user'"
                    ></mat-icon>
                    <span class="ml-1">Crear Usuario</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">
        <div
            class="flex flex-col flex-auto sm:mb-18 overflow-hidden overflow-x-auto sm:overflow-y-auto"
        >
            <tt-table
                [data]="data$ | async"
                [columns]="columns"
                [total]="responsePagination?.totalRecords"
                (edit)="editUser($event)"
                (delete)="deleteUser($event)"
                (toggleUtilStatus)="toggleUserStatus($event)"
            ></tt-table>
        </div>
    </div>
</div>
