<div style="overflow-y: auto; max-height: 90vh; padding: 10px">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">
        Crear Usuario
    </h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
        {{ alert.message }}
    </fuse-alert>

    <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Usuario</mat-label>
            <input
                matInput
                type="text"
                formControlName="username"
                placeholder="juan"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nro. de Carnet</mat-label>
            <input
                matInput
                type="text"
                formControlName="dni"
                placeholder="123ABC"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre(s)</mat-label>
            <input
                matInput
                type="text"
                formControlName="firstName"
                placeholder="Juan"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Apellido(s)</mat-label>
            <input
                matInput
                type="text"
                formControlName="lastName"
                placeholder="Perez"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Contraseña</mat-label>
            <input
                matInput
                type="password"
                formControlName="password"
                placeholder="12345678"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Rol</mat-label>
            <mat-select formControlName="role">
                <mat-option *ngFor="let role of roles" [value]="role.value">
                    {{ role.label }}
                </mat-option>
            </mat-select>
        </mat-form-field>

    </form>

    <div class="flex justify-end mt-4 space-x-4">
        <button
            mat-raised-button
            color="warn"
            (click)="close()"
            class="warn"
            [disabled]="isSaving"
        >
            Cancelar
        </button>

        <button
            mat-raised-button
            (click)="save()"
            [disabled]="!form.valid || isSaving"
            color="primary"
            [ngClass]="{ 'text-white': form.valid && !isSaving }"
        >
            Guardar
        </button>
    </div>
</div>
