<div class="overflow-y-auto max-h-[90vh] p-4" *ngIf="form">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">
        Asignar Stands al Evento
    </h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
        {{ alert.message }}
    </fuse-alert>

    <form [formGroup]="form">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Nombre</mat-label>
                <input matInput type="text" formControlName="name" readonly />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Tipo</mat-label>
                <mat-select formControlName="type" disabled>
                    <mat-option
                        *ngFor="let type of eventTypes"
                        [value]="type.value"
                    >
                        {{ type.label }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Fecha de Inicio</mat-label>
                <input
                    matInput
                    [matDatepicker]="startPicker"
                    formControlName="start"
                    readonly
                />
                <mat-datepicker-toggle
                    matSuffix
                    [for]="startPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker #startPicker disabled></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Fecha de Fin</mat-label>
                <input
                    matInput
                    [matDatepicker]="endPicker"
                    formControlName="end"
                    readonly
                />
                <mat-datepicker-toggle
                    matSuffix
                    [for]="endPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker #endPicker disabled></mat-datepicker>
            </mat-form-field>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div class="w-full flex items-center">
                <mat-checkbox formControlName="sendQR" disabled
                    >Enviar QR</mat-checkbox
                >
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-bold mb-2">STANDS</h3>
            <div class="max-h-[250px] overflow-y-auto">
                <table
                    mat-table
                    [dataSource]="availableStands"
                    class="w-full mb-4"
                >
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let stand">
                            {{ stand.name }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef>Seleccionar</th>
                        <td mat-cell *matCellDef="let stand">
                            <mat-checkbox
                                (change)="onStandSelectionChange($event, stand)"
                                [checked]="isStandSelected(stand)"
                            ></mat-checkbox>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="queueCode">
                        <th mat-header-cell *matHeaderCellDef>
                            Código de Cola
                        </th>
                        <td mat-cell *matCellDef="let stand">
                            <input
                                [(ngModel)]="stand.queueCode"
                                #queueCodeInput="ngModel"
                                [ngModelOptions]="{ standalone: true }"
                                [disabled]="!isStandSelected(stand)"
                                placeholder="Ej: 123ABC"
                                [ngClass]="{
                                    'border-red-500':
                                        isStandSelected(stand) &&
                                        (!queueCodeInput.value ||
                                            queueCodeInput.value.trim() === ''),
                                }"
                                class="w-full border-b border-gray-300 px-0 py-1 focus:outline-none focus:border-blue-500 disabled:opacity-50"
                            />
                        </td>
                    </ng-container>

                    <tr
                        mat-header-row
                        *matHeaderRowDef="standDisplayedColumns"
                    ></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: standDisplayedColumns"
                    ></tr>
                </table>
            </div>
        </div>
    </form>

    <div class="flex justify-end mt-4 space-x-4">
        <button
            mat-raised-button
            color="warn"
            (click)="close()"
            class="px-6 py-2 font-semibold rounded-lg"
            [disabled]="isSaving"
        >
            Cancelar
        </button>
        <button
            mat-raised-button
            (click)="save()"
            [ngClass]="{
                'bg-blue-900 text-white':
                    form.valid && !isSaving && areQueueCodesValid(),
            }"
            [disabled]="!form.valid || isSaving || !areQueueCodesValid()"
            class="px-6 py-2 font-semibold rounded-lg shadow-md transition-shadow duration-300 hover:shadow-lg"
        >
            Guardar
        </button>
    </div>
</div>
