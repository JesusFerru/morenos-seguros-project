<div style="overflow-y: auto; max-height: 90vh; padding: 10px">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">
        Crear Stand
    </h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
        {{ alert.message }}
    </fuse-alert>

    <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre</mat-label>
            <input
                matInput
                type="text"
                formControlName="name"
                placeholder="e.g., Stand Principal"
            />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="status">
                <mat-option *ngFor="let stat of statuses" [value]="stat.value">
                    {{ stat.label }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </form>

    <div class="flex justify-end mt-4 space-x-4">
        <button
            mat-raised-button
            color="warn"
            (click)="close()"
            class="px-6 py-2 font-semibold rounded-lg"
            [disabled]="isSaving"
        >
            Cancelar
        </button>
        <button
            mat-raised-button
            (click)="save()"
            [ngClass]="{ 'bg-blue-900 text-white': form.valid && !isSaving }"
            [disabled]="!form.valid || isSaving"
            class="px-6 py-2 font-semibold rounded-lg shadow-md transition-shadow duration-300 hover:shadow-[0px_2px_4px_-1px_rgba(0,0,0,0.2),_0px_4px_5px_0px_rgba(0,0,0,0.14),_0px_1px_10px_0px_rgba(0,0,0,0.12)]"
        >
            Guardar
        </button>
    </div>
</div>
