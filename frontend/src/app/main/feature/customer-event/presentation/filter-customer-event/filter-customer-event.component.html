<div class="relative">
    <div style="background-color: #f7f7f7;"
         class="sm:w-full lg:h-full w-16 h-10 shadow-lg rounded-lg cursor-pointer bg-opacity-90 print:hidden"
         [class.lg:right-0]="config.layout === 'centered' || config.layout === 'material'"
         [class.lg:right-0]="config.layout !== 'centered' && config.layout !== 'material'"
         matTooltip="Filtros">
        <button (click)="settingsDrawer.toggle()" class="text-black flex flex-row py-2 px-4 mx-auto">
            <mat-icon class="icon-size-5 text-black" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
            <span class="hidden md:block">Filtros</span>
        </button>
    </div>
</div>
<fuse-drawer class="w-screen min-w-screen sm:w-100 sm:min-w-100 z-999" fixed [mode]="'over'" [name]="'settingsDrawer'"
    [position]="'right'" #settingsDrawer>
    <!-- Encabezado -->
    <div class="fixed top-0 left-0 w-full z-50 bg-card">
        <div class="absolute top-0 left-0 px-4 py-2">
            <button mat-icon-button (click)="settingsDrawer.toggle()">
                <mat-icon>arrow_back</mat-icon>
            </button>
        </div>
        <div style="background-color: #f5f5f5;" class="text-lg font-bold text-center py-4 text-gray-700">Filtros</div>
    </div>

    <!-- Contenido desplazable -->
    <div class="flex flex-col w-full overflow-auto bg-card" style="padding-top: 64px;">
        <form [formGroup]="form">
            <div class="text-lg font-bold text-center pt-6">Filtros</div>
            <div class="flex flex-col p-6">
                <mat-form-field class="py-3 pl-5 pr-6">
                    <mat-label>Fecha Desde - Fecha Hasta</mat-label>
                    <mat-date-range-input [rangePicker]="picker" [max]="maxDate">
                        <input [formControlName]="'startDate'" matStartDate placeholder="Fecha Inicio" />
                        <input [formControlName]="'endDate'" matEndDate placeholder="Fecha Fin" />
                    </mat-date-range-input>
                    <mat-hint>MM/dd/yyyy – MM/dd/yyyy</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>
                </mat-form-field>

                <mat-form-field class="py-3 pl-5 pr-6">
                    <mat-label>Tipo de Filtro</mat-label>
                    <mat-select [formControlName]="'filterType'">
                        <mat-option value="preregistered">Preregistrados</mat-option>
                        <mat-option value="entered">Ingresados</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field class="py-3 pl-5 pr-6">
                    <mat-label>Género</mat-label>
                    <mat-select [formControlName]="'gender'">
                        <mat-option value="">Todos</mat-option>
                        <mat-option value="Male">Masculino</mat-option>
                        <mat-option value="Female">Femenino</mat-option>
                        <mat-option value="NoBinary">No Binario</mat-option>
                        <mat-option value="Unknown">Otro</mat-option>
                    </mat-select>
                </mat-form-field>

                <div class="flex flex-row justify-between items-end pt-0 pl-6 pr-5 mt-auto">
                    <button mat-flat-button type="button" style="background-color: #f7f7f7; padding-top: 20px !important; padding-bottom: 20px !important;"
                        class="text-black font-bold px-4 rounded items-center" (click)="clearFilter()">
                        Limpiar Filtro
                    </button>
                    <button mat-flat-button type="button" style="background-color: #0047ba; padding-right: 39px !important; padding-left: 39px !important;"
                        class="text-white font-bold rounded" (click)="onSearch(); settingsDrawer.toggle()">
                        Filtrar
                    </button>
                </div>
            </div>
        </form>
    </div>
</fuse-drawer>
