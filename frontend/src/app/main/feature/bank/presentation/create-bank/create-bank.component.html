<div style="overflow-y: auto; max-height: 90vh; padding: 10px">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">Crear Cuenta Bancaria</h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
      {{ alert.message }}
    </fuse-alert>

    <form [formGroup]="form" class="grid grid-cols-1 gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Banco</mat-label>
        <input matInput formControlName="bank" placeholder="Nombre del banco" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tipo de Cuenta</mat-label>
        <mat-select formControlName="accountType">
          <mat-option *ngFor="let type of accountTypes" [value]="type.value">
            {{ type.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Número de Cuenta</mat-label>
        <input matInput formControlName="accountNumber" placeholder="Número de cuenta bancaria" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Moneda</mat-label>
        <mat-select formControlName="currency">
          <mat-option *ngFor="let currency of currencies" [value]="currency.value">
            {{ currency.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre del Titular</mat-label>
        <input matInput formControlName="holderName" placeholder="Nombre completo del titular" />
      </mat-form-field>
    </form>

    <div class="flex justify-end mt-4 space-x-4">
      <button mat-raised-button color="warn" (click)="close()" [disabled]="isSaving">
        Cancelar
      </button>
      <button mat-raised-button color="primary" (click)="save()" [disabled]="!form.valid || isSaving">
        Guardar
      </button>
    </div>
  </div>
