<div style="overflow-y: auto; max-height: 90vh; padding: 10px">
    <h1 class="text-2xl text-center font-bold mb-6 text-gray-800">Crear Plan de Seguro</h1>

    <fuse-alert *ngIf="alert" [type]="alert.type" class="mb-4">
      {{ alert.message }}
    </fuse-alert>

    <form [formGroup]="form" class="grid grid-cols-1 gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre del Plan</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Compañía Aseguradora</mat-label>
        <mat-select formControlName="insuranceCompanyId">
          <mat-option *ngFor="let company of companies" [value]="company.id">
            {{ company.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>

    <div class="flex justify-end mt-4 space-x-4">
      <button mat-raised-button color="warn" (click)="close()" [disabled]="isSaving">
        Cancelar
      </button>
      <button mat-raised-button color="primary" (click)="save()" [disabled]="!form.valid || isSaving">
        Guardar
      </button>
    </div>
  </div>
