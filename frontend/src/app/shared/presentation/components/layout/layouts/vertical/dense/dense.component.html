<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<!-- Navigation -->
<fuse-vertical-navigation
    class="bg-blue text-white print:hidden"
    [appearance]="navigationAppearance"
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation"
    [opened]="!isScreenSmall"
>
    <!-- Navigation header hook -->
    <ng-container fuseVerticalNavigationContentHeader>
        <!-- Header container -->
        <div class="flex flex-col items-center p-4 text-10xl fuse-nav-header">
            <!-- Logo -->
            <div class="flex flex-col items-center justify-center mt-1">
                <img class="w-20" src="assets/images/logo/moreno-icon-only.png" alt="Logo" />
            </div>

            <div class="text-center nav-header-text">
                <div class="flex items-center mt-1">
                    <span class="text-white text-5xl font-bold">MORENO SEGUROS</span>
                </div>
            </div>
        </div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">
    <!-- Header -->
    <div
        class="relative flex flex-0 items-center w-full h-16 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden"
    >
        <div class="flex items-center pr-2 space-x-2">
            <!-- Navigation toggle button -->
            <button mat-icon-button (click)="openFunction('mainNavigation')">
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
        </div>

        <!-- Components -->

        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
            <!-- <ms-notifications></ms-notifications> -->
            <div
                class="group flex items-center justify-center p-2 ml-auto bg-white hover:bg-gray-100 text-blue-900 rounded cursor-pointer w-auto"
                (click)="signOut()"
            >
                <mat-icon
                    [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"
                    class="text-blue-900"
                ></mat-icon>
                <span>Cerrar sesión</span>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto">
        <!-- *ngIf="true" hack is required here for router-outlet to work correctly.
             Otherwise, layout changes won't be registered and the view won't be updated! -->
        <router-outlet *ngIf="true"></router-outlet>
    </div>

    <!-- Footer -->
    <div
        class="relative flex flex-0 items-center justify-start w-full h-14 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden"
    >
        <span class="font-medium text-secondary"
            >morenoseguros &copy; {{ currentYear }}</span
        >
    </div>
</div>
